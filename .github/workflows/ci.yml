name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build ModFileBuilder.slnx --configuration Release --maxcpucount:1

      - name: Run core checks
        run: dotnet run --configuration Release --no-build --project tests/ModFileBuilder.Checks

      - name: Run macOS UI checks (headless)
        run: dotnet run --configuration Release --no-build --project tests/ModFileBuilder.Mac.Checks
