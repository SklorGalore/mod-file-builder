name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package and release
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Package Windows x64 with Velopack
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        run: dotnet publish src/ModFileBuilder.Windows/ModFileBuilder.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/windows-x64

      - name: Install Velopack CLI
        run: dotnet tool install vpk --tool-path .tools --version 1.2.158

      - name: Package installer and updates
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./.tools/vpk.exe pack --packId SklorGalore.ModFileBuilder.Windows --packVersion $version --packDir publish/windows-x64 --mainExe ModFileBuilder.Windows.exe --packTitle "Case Modification Builder" --packAuthors "SklorGalore" --shortcuts StartMenuRoot,Desktop --outputDir publish/velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-velopack
          path: |
            publish/velopack/*
            !publish/velopack/assets.win.json
            !publish/velopack/RELEASES
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --generate-notes --verify-tag
